name: Feature request
description: Suggest a keyboard, a language, or a behaviour.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to type or do that LangSmart doesn't handle?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Suggested approach
      description: For a new keyboard or language, name the macOS input source and say whether it has a system spelling dictionary.
